version: '3.8'

services:
  web-ui:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vibe_web_ui
    user: root
    restart: always
    environment:
      - NODE_ENV=production
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-vibe2026}
      - JWT_SECRET=${JWT_SECRET:-vibe-command-center-super-secret-key-2026}
      - DATA_PATH=/app/data
      - VPS_ROOT_PATH=/vps_data
    volumes:
      - vibe_data:/app/data
      - ./workspace:/app/workspace:rw
      - /:/vps_data:rw # Mount VPS root filesystem for browser file manager
    ports:
      - "3000:3000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  caddy:
    image: caddy:2-alpine
    container_name: vibe_caddy_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web-ui
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vibe_data:
  caddy_data:
  caddy_config:
